name: Contrôle qualité du référentiel

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 1 * *'   # veille mensuelle : détecte les données périmées

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Tests du pipeline
        run: python3 -m unittest discover -s tests -v
      - name: Contrôle du catalogue
        run: python3 pipeline/validate.py
      - name: Vérifier que les sorties générées sont à jour
        run: |
          python3 pipeline/build_guide.py
          python3 pipeline/build_site.py
          git diff --exit-code site/ data/ Guide_Complet_Solutions_Dev_IA_2026.md || {
            echo "::error::Sorties générées obsolètes — lancer build_guide.py et build_site.py, puis commiter"
            exit 1
          }
