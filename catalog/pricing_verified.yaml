no_public_price:
- reason: 'Identifiant de passerelle : le préfixe désigne le revendeur qui sert le modèle, pas le laboratoire.
    Le tarif applicable est celui de la passerelle, relevé en couche 2 — pas celui de l''éditeur.'
  models:
  - fireworks/kimi-k2p5
  - deepseek/deepseek-v3.2
- reason: 'Modèle diffusé en poids ouverts : le laboratoire ne facture pas d''API pour lui. Le coût dépend
    entièrement de l''hébergeur qui le sert, et se relève donc chez lui.'
  models:
  - qwen3.5-122b-a10b_none
  - qwen3.5-35b-a3b
  - qwen3.5-397b-a17b
  - qwen3.5-9B
  - qwen3.6-27b
