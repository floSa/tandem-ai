# Tarifs API relevés sur sources primaires.
#
# Ce fichier est ÉDITÉ À LA MAIN — c'est le seul endroit où l'on saisit un tarif.
# `pipeline/apply_pricing.py` le fusionne dans catalog/models.yaml.
#
# Règles :
#   • montants en USD par 1M de tokens, jamais en euros (conversion au build)
#   • `source.status: official_pricing_page` UNIQUEMENT si la page du fournisseur
#     a été ouverte et lue. Sinon `community` et le validateur le signalera.
#   • `verified_on` = date de consultation réelle de la page.
#   • `applies_to` = identifiants du catalogue qui désignent LE MÊME modèle facturé
#     (instantané daté type `gpt-5-2025-08-07`, alias de passerelle). Le tarif y est
#     recopié à l'identique. N'y mettre JAMAIS un modèle simplement « proche ».
#     Les variantes d'effort (`_none`, `_32K`, `_high`) sont propagées
#     automatiquement par apply_pricing.py : ne pas les lister ici.
#
# La section `no_public_price` en fin de fichier recense les modèles qui n'auront
# JAMAIS de tarif éditeur — et pourquoi. Sans elle, ils resteraient éternellement
# « à relever » alors qu'il n'y a rien à relever.

_meta:
  campaign: "Vérification tarifaire septembre 2026"
  operator: "pipeline + relevé manuel"

