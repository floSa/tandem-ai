# ════════════════════════════════════════════════════════════════════════════
# MODÈLES SANS TARIF ÉDITEUR
#
# Ces modèles n'ont pas de tarif à relever : ils ne figurent pas dans la grille
# de leur laboratoire, et n'y figureront pas. Les distinguer des modèles « pas
# encore relevés » est la seule façon de rendre le reste-à-faire honnête.
#
# Chaque entrée porte l'identifiant du MODÈLE DE BASE : les variantes d'effort
# (`_none`, `_32K`…) héritent automatiquement de la classification.
# ════════════════════════════════════════════════════════════════════════════
no_public_price:

  - reason: >-
      Identifiant de passerelle : le préfixe désigne le revendeur qui sert le
      modèle, pas le laboratoire. Le tarif applicable est celui de la passerelle,
      relevé en couche 2 — pas celui de l'éditeur.
    models: [openai/gpt-oss-120b, qwen/qwen3-235b-a22b-thinking-2507,
             zai-org/glm-4.7, fireworks/kimi-k2p5, moonshotai/kimi-k2-0905,
             deepseek/deepseek-v3.2]

  - reason: >-
      Modèle diffusé en poids ouverts : le laboratoire ne facture pas d'API pour
      lui. Le coût dépend entièrement de l'hébergeur qui le sert, et se relève
      donc chez lui.
    models: [Qwen3-235B-A22B-Instruct-2507, Qwen3-235B-A22B-Thinking-2507,
             Qwen3-Coder-480B-A35B-Instruct, qwen3-30b-a3b-instruct-2507,
             qwen3-30b-a3b-thinking-2507, qwen3.5-122b-a10b_none, qwen3.5-35b-a3b,
             qwen3.5-397b-a17b, qwen3.5-9B, qwen3.6-27b, qwen3.6-35b-a3b,
             qwen3.8-27b, gpt-oss-120b, gpt-oss-20b, gemma-4-26b-a4b,
             gemma-4-26b-a4b-it, gemma-4-31b-it]

  - reason: >-
      Version de pré-lancement ou d'évaluation, jamais commercialisée : elle a
      été mesurée par une source indépendante mais n'a pas de grille tarifaire.
    models: [gpt-5.5-pre-release, gpt-5.5-pro-pre-release,
             claude-mythos-preview-early, gemini-3-deep-think-preview]

  - reason: >-
      Génération retirée de la grille officielle du laboratoire au 15/09/2026.
      Le score reste publiable — il a été mesuré — mais le tarif ne l'est plus :
      le modèle n'est plus vendu à ce prix, ni à aucun autre.
    models: [gpt-5-codex, gpt-5.1-codex, gpt-5.1-codex-max, gpt-5.1-codex-mini,
             gpt-5.2-codex, gpt-5.5-instant, claude-opus-4-5-20251101,
