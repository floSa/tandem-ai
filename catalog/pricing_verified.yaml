             Kimi-K2-Instruct, kimi-k2-thinking, kimi-k2-thinking-turbo,
             kimi-k2.5, grok-3-mini, grok-4-0709, grok-4-1, grok-4-20,
             grok-4-fast, muse-spark, muse-spark-1.1, muse-spark-1.2,
             mistral-medium-2508, mistral-small-2506, mistral-small-3.2-2506]

