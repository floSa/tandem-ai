# Tarifs API relevés sur sources primaires.
#
# Ce fichier est ÉDITÉ À LA MAIN — c'est le seul endroit où l'on saisit un tarif.
# `pipeline/apply_pricing.py` le fusionne dans catalog/models.yaml.
#
# Règles :
#   • montants en USD par 1M de tokens, jamais en euros (conversion au build)
#   • `source.status: official_pricing_page` UNIQUEMENT si la page du fournisseur
#     a été ouverte et lue. Sinon `community` et le validateur le signalera.
#   • `verified_on` = date de consultation réelle de la page.

_meta:
  campaign: "Vérification tarifaire septembre 2026"
  operator: "pipeline + relevé manuel"

